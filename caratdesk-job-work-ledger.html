<!-- CaratDesk – Job Work Ledger Report -->
<head>
  <meta charset="UTF-8"><script src="/caratdesk-sidebar.js"></script>
</head>
<style>    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap');

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    .navbar,.page-header,footer.web-footer,.container>.row>.col-sm-10,.frappe-footer{display:none!important}
    .web-page-container,.container{padding:0!important;max-width:100%!important}
    body{overflow-x:hidden}
    :root{--bg:#F7F6F3;--surface:#FFF;--border:rgba(0,0,0,.07);--border-strong:rgba(0,0,0,.12);--text-primary:#1A1A18;--text-secondary:#6B6B65;--text-muted:#A8A8A2;--accent:#1A1A18;--accent-light:#F0EFE9;--nav-hover:#F7F6F3;--nav-active-bg:#EBEBE5;--pill-green-bg:#EAF3DE;--pill-green-txt:#3B6D11;--pill-red-bg:#FCEBEB;--pill-red-txt:#A32D2D;--pill-amber-bg:#FAEEDA;--pill-amber-txt:#854F0B;--pill-blue-bg:#E8F0FD;--pill-blue-txt:#1A4A8A;--shadow-sm:0 2px 12px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.03);--shadow-md:0 4px 24px rgba(0,0,0,.08)}
    .dark{--bg:#121212;--surface:#1E1E1E;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);--text-primary:#EDEDED;--text-secondary:#A0A0A0;--text-muted:#6E6E6E;--accent:#D4D4D4;--accent-light:#2C2C2C;--nav-hover:#252525;--nav-active-bg:#2D2D2D;--pill-green-bg:#1E3A2E;--pill-green-txt:#9CD45E;--pill-red-bg:#3E1E1E;--pill-red-txt:#F28B82;--pill-amber-bg:#3E2E1E;--pill-amber-txt:#FDBF6B;--pill-blue-bg:#1A2A3E;--pill-blue-txt:#7AABF0;--shadow-sm:0 2px 12px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.05);--shadow-md:0 4px 24px rgba(0,0,0,.3)}
    html,body{color:var(--text-primary)}
    *{transition:background-color .2s,border-color .2s,color .2s}
    .cd-app{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;color:var(--text-primary)}
    .cd-sidebar{width:260px;background:var(--surface);border-right:.5px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:200;box-shadow:var(--shadow-sm);transform:translateX(0);transition:transform .3s cubic-bezier(.2,.9,.4,1.1)}
    @media(max-width:768px){.cd-sidebar{transform:translateX(-100%)}.cd-sidebar.mobile-open{transform:translateX(0);width:80%;max-width:280px}}
    .cd-sidebar-logo{display:flex;align-items:center;gap:11px;padding:20px 16px 18px;border-bottom:.5px solid var(--border);text-decoration:none;color:inherit}
    .cd-sidebar-logo img{width:30px;height:30px;object-fit:contain;border-radius:9px}
    .cd-logo-name{font-family:'DM Serif Display',serif;font-size:17px;letter-spacing:-.2px}
    .cd-logo-sub{font-size:10px;color:var(--text-muted);font-weight:300;letter-spacing:.07em;text-transform:uppercase}
    .cd-nav{flex:1;padding:10px 8px;overflow-y:auto}
    .cd-nav-section{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;padding:14px 8px 5px}
    .cd-nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;margin-bottom:1px;text-decoration:none;color:var(--text-secondary);font-size:13.5px;transition:background .14s,color .14s}
    .cd-nav-item:hover{background:var(--nav-hover);color:var(--text-primary)}
    .cd-nav-item.active{background:var(--nav-active-bg);color:var(--text-primary);font-weight:500}
    .cd-nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cd-nav-icon svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .cd-sidebar-bottom{padding:10px 8px;border-top:.5px solid var(--border)}
    .cd-user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;transition:background .14s}
    .cd-user-card:hover{background:var(--nav-hover)}
    .cd-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--surface);flex-shrink:0}
    .cd-user-name{font-size:13px;font-weight:500}
    .cd-user-role{font-size:11px;color:var(--text-muted);font-weight:300}
    .cd-logout-btn{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text-secondary);margin-top:3px;border:none;background:none;font-family:'DM Sans',sans-serif;width:100%;transition:background .14s,color .14s}
    .cd-logout-btn:hover{background:var(--pill-red-bg);color:var(--pill-red-txt)}
    .cd-instance-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
    .cd-instance-label{font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.07em;text-transform:uppercase;flex:1}
    .cd-instance-pills{display:flex;gap:4px}
    .cd-instance-pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:6px;border:.5px solid var(--border);background:var(--input-bg);color:var(--text-secondary);cursor:pointer;transition:background .14s,color .14s,border-color .14s;font-family:'DM Sans',sans-serif}
    .cd-instance-pill:hover{background:var(--nav-hover);color:var(--text-primary)}
    .cd-instance-pill.active{background:var(--accent);color:var(--surface);border-color:var(--accent)}
    .cd-main{margin-left:260px;flex:1;min-height:100vh;display:flex;flex-direction:column}
    @media(max-width:768px){.cd-main{margin-left:0}}
    .cd-topbar{height:58px;background:var(--surface);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
    .cd-menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text-secondary);margin-right:12px}
    @media(max-width:768px){.cd-menu-btn{display:flex;align-items:center;justify-content:center}}
    .cd-topbar-left{display:flex;align-items:center;gap:10px}
    .cd-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13.5px}
    .cd-breadcrumb a{color:var(--text-muted);text-decoration:none;transition:color .14s}
    .cd-breadcrumb a:hover{color:var(--text-primary)}
    .cd-breadcrumb-sep{color:var(--text-muted);font-size:12px}
    .cd-breadcrumb-cur{color:var(--text-primary);font-weight:500}
    .cd-topbar-right{display:flex;align-items:center;gap:8px}
    .cd-icon-btn{width:34px;height:34px;border-radius:9px;border:.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);transition:background .14s,color .14s}
    .cd-icon-btn:hover{background:var(--nav-hover);color:var(--text-primary)}
    .cd-icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    .cd-content{padding:24px 28px;flex:1;animation:fadeIn .35s cubic-bezier(.16,1,.3,1) both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .cd-page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .cd-page-title{font-size:20px;font-weight:500;letter-spacing:-.3px}
    .cd-page-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;font-weight:300}
    .cd-btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;transition:background .14s,transform .1s;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
    .cd-btn:active{transform:scale(.98)}
    .cd-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .cd-btn-primary{background:var(--text-primary);color:var(--surface)}
    .cd-btn-primary:hover{opacity:.85}
    .cd-btn-secondary{background:var(--surface);color:var(--text-primary);border:.5px solid var(--border-strong)}
    .cd-btn-secondary:hover{background:var(--accent-light)}
    .cd-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .cd-search-wrap{position:relative;flex:1;min-width:180px;max-width:280px}
    .cd-search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:1.8;pointer-events:none}
    .cd-search-input{width:100%;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);border:.5px solid var(--border-strong);border-radius:9px;padding:8px 12px 8px 34px;color:var(--text-primary);outline:none;transition:border-color .14s,box-shadow .14s}
    .cd-search-input:focus{border-color:var(--text-secondary);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
    .cd-search-input::placeholder{color:var(--text-muted)}
    .cd-fpill{position:relative;display:flex;align-items:center;background:var(--bg);border:.5px solid var(--border);border-radius:9px;min-width:130px}
    .cd-fpill:hover{border-color:var(--border-strong)}
    .cd-filter-sel{appearance:none;-webkit-appearance:none;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;background:none;border:none;border-radius:9px;padding:9px 26px 9px 13px;color:var(--text-secondary);outline:none;cursor:pointer;width:100%}
    .cd-fpill.has-value .cd-filter-sel{color:var(--text-primary)}
    .cd-fpill::after{content:'';position:absolute;right:11px;top:50%;width:8px;height:8px;border-right:1.6px solid var(--text-muted);border-bottom:1.6px solid var(--text-muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}
    .cd-fpill-date{padding:0}
    .cd-fpill-date .cd-filter-date{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;background:none;border:none;outline:none;color:var(--text-primary);padding:9px 13px;width:100%;cursor:pointer}
    .cd-fpill-date::after{display:none}
    .cd-fpill-label{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:500;color:var(--text-secondary);pointer-events:none}
    .cd-filter-date.cd-empty::-webkit-datetime-edit,
    .cd-filter-date.cd-empty::-webkit-datetime-edit-fields-wrapper{color:transparent}
    .cd-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .cd-result-count{font-size:12px;color:var(--text-muted);white-space:nowrap}
    .cd-table-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:18px;overflow-x:auto}
    .cd-table-wrap+.cd-table-wrap{margin-top:18px}
    .cd-group-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:var(--bg);border-bottom:.5px solid var(--border);flex-wrap:wrap;gap:6px}
    .cd-group-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
    .cd-group-dot{width:9px;height:9px;border-radius:50%}
    .cd-group-stat{font-size:11.5px;color:var(--text-muted)}
    .cd-table{width:100%;border-collapse:collapse}
    .cd-table thead{background:var(--bg)}
    .cd-table th{font-size:11px;font-weight:500;color:var(--text-muted);text-align:left;padding:11px 16px;letter-spacing:.05em;text-transform:uppercase;border-bottom:.5px solid var(--border);white-space:nowrap;user-select:none}
    .cd-table td{font-size:13px;padding:11px 16px;border-bottom:.5px solid var(--border);vertical-align:middle;white-space:nowrap}
    .cd-table tr:last-child td{border-bottom:none}
    .cd-table tbody tr:hover{background:var(--nav-hover)}
    .cd-table td.num{text-align:right;font-variant-numeric:tabular-nums}
    .cd-table tr.opening td{background:var(--accent-light);font-weight:500}
    .cd-table tr.closing td{background:var(--accent-light);font-weight:600;border-top:1px solid var(--border-strong)}
    .cd-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:100px;font-weight:500;white-space:nowrap}
    .cd-pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    .cd-pill.green{background:var(--pill-green-bg);color:var(--pill-green-txt)}.cd-pill.green .cd-pill-dot{background:var(--pill-green-txt)}
    .cd-pill.blue{background:var(--pill-blue-bg);color:var(--pill-blue-txt)}.cd-pill.blue .cd-pill-dot{background:var(--pill-blue-txt)}
    .cd-pill.amber{background:var(--pill-amber-bg);color:var(--pill-amber-txt)}.cd-pill.amber .cd-pill-dot{background:var(--pill-amber-txt)}
    .cd-pill.grey{background:var(--accent-light);color:var(--text-secondary)}.cd-pill.grey .cd-pill-dot{background:var(--text-muted)}
    .cd-empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
    .cd-empty svg{width:40px;height:40px;stroke:var(--text-muted);fill:none;stroke-width:1.2;margin:0 auto 12px;display:block}
    .cd-empty-title{font-size:13.5px;font-weight:500;color:var(--text-secondary)}
    .cd-dr{color:var(--pill-red-txt)}
    .cd-cr{color:var(--pill-green-txt)}
    .cd-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);color:var(--surface);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);z-index:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;display:flex;align-items:center;gap:8px}
    .cd-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .cd-toast.success{background:#2D6A4F}.cd-toast.error{background:var(--pill-red-txt)}.cd-toast.info{background:#1A4A8A}
    </style>

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){return d;} }
function fmtQty(n){ return (Math.abs(n)<1e-9?0:n).toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3}); }
function voucherPill(t){
  const isSE = t==='Stock Entry';
  return `<span class="cd-pill ${isSE?'amber':'blue'}"><span class="cd-pill-dot"></span>${esc(t||'—')}</span>`;
}
const RMT_COLORS = { Metal:'#C9A227', Diamond:'#5B7A8C' };
function unitFor(rmType){ return rmType==='Diamond' ? 'ct' : 'g'; }

// ══════════════════════════════════════════
//  DATA LOADING — combines every instance the user has access to, same as Purity Ledger.
// ══════════════════════════════════════════
const JWL_FIELDS = ['name','datetime','posting_date','company','branch','supplier','raw_material_type','item_code','uom','qty_dr','qty_cr','pure_qty_dr','pure_qty_cr','voucher_type','voucher_name','balance','is_cancel','remarks'];
let JWL_DATA = [];

function mapRows(rows){
  return rows.map(r => ({
    name: r.name,
    datetime: r.datetime || '',
    postingDate: r.posting_date || (r.datetime||'').slice(0,10),
    company: r.company || '',
    branch: r.branch || '',
    supplier: r.supplier || '',
    rawMaterialType: r.raw_material_type || '',
    itemCode: r.item_code || '',
    uom: r.uom || '',
    qtyDr: parseFloat(r.qty_dr) || 0,
    qtyCr: parseFloat(r.qty_cr) || 0,
    pureQtyDr: parseFloat(r.pure_qty_dr) || 0,
    pureQtyCr: parseFloat(r.pure_qty_cr) || 0,
    voucherType: r.voucher_type || '',
    voucherName: r.voucher_name || '',
    isCancel: r.is_cancel === 1 || r.is_cancel === '1',
    remarks: r.remarks || '',
  }));
}

// Net effect on the running balance for one row — Metal moves in pure qty, Diamond in plain
// qty. Debit (material sent out) increases the balance still pending with the supplier;
// Credit (material accounted for, via BOM or a physical return) decreases it.
function netEffect(r){
  return r.rawMaterialType==='Metal' ? (r.pureQtyDr - r.pureQtyCr) : (r.qtyDr - r.qtyCr);
}

async function fetchInstance(instName){
  const key = instName==='PC' ? localStorage.getItem('cd_pc_key') : localStorage.getItem('cd_pp_key');
  const sec = instName==='PC' ? localStorage.getItem('cd_pc_secret') : localStorage.getItem('cd_pp_secret');
  if(!key||!sec) return [];
  const baseUrl = cdGetInstanceUrl(instName);
  const headers = {'Authorization':`token ${key}:${sec}`,'Accept':'application/json'};
  const url = `${baseUrl}/api/resource/Job%20Work%20Ledger%20Entry?fields=${encodeURIComponent(JSON.stringify(JWL_FIELDS))}&limit_page_length=100000&order_by=creation%20asc`;
  const res = await fetch(url, {headers});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return mapRows(json.data || json.message || []);
}

async function load(){
  document.getElementById('reportBody').innerHTML = `<div class="cd-table-wrap"><div class="cd-empty"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><div class="cd-empty-title">Loading job work ledger…</div></div></div>`;
  try{
    const available = cdGetAvailableInstances();
    if(!available.length){ window.location.replace('/caratdesk-login?logout=1'); return; }
    // Job Work Ledger Entry only exists on PP — PC isn't used for job work, so skip it here
    // rather than firing a request that's guaranteed to 404.
    const dataInstances = available.includes('PP') ? ['PP'] : available;
    const results = await Promise.allSettled(dataInstances.map(inst => fetchInstance(inst)));
    JWL_DATA = [];
    let anyOk = false;
    results.forEach((r,i) => {
      if(r.status==='fulfilled'){ JWL_DATA.push(...r.value); anyOk=true; }
      else console.warn('Failed to load', dataInstances[i], r.reason?.message);
    });
    if(!anyOk) throw new Error('All instances failed to load');

    populateSupplierDropdown();
    applyFilters();
  }catch(e){
    console.error('Load Job Work Ledger error:', e);
    document.getElementById('reportBody').innerHTML = `<div class="cd-table-wrap"><div class="cd-empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="cd-empty-title">Failed to load</div><div><a href="#" onclick="load()" style="color:var(--pill-blue-txt)">Retry</a></div></div></div>`;
  }
}

function populateSupplierDropdown(){
  const suppliers = [...new Set(JWL_DATA.map(r=>r.supplier).filter(Boolean))].sort();
  const sel = document.getElementById('supplierFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Supplier</option>' + suppliers.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if(suppliers.includes(cur)) sel.value = cur;
}

// ══════════════════════════════════════════
//  REPORT — grouped by Supplier + Raw Material Type once a Supplier is picked (running
//  balance shown), otherwise a flat recent-activity list across everyone (like Purity
//  Ledger). Balance is always recomputed from the raw Dr/Cr history, never trusted from the
//  stored `balance` column.
// ══════════════════════════════════════════
let LAST_BLOCKS = [];
let LAST_FLAT_ROWS = [];

function syncFilterPillStates(){
  ['supplierFilter','rmtFilter','voucherFilter'].forEach(id=>{
    const sel = document.getElementById(id);
    sel.closest('.cd-fpill')?.classList.toggle('has-value', !!sel.value);
  });
  ['dateFrom','dateTo'].forEach(id=>{
    const inp = document.getElementById(id);
    const hasValue = !!inp.value;
    inp.classList.toggle('cd-empty', !hasValue);
    const label = document.getElementById(id === 'dateFrom' ? 'dateFromLabel' : 'dateToLabel');
    if(label) label.style.display = hasValue ? 'none' : '';
  });
}

function applyFilters(){
  syncFilterPillStates();
  const q = document.getElementById('jwlSearch').value.trim().toLowerCase();
  const supplierFilter = document.getElementById('supplierFilter').value;
  const rmtFilter = document.getElementById('rmtFilter').value;
  const voucherFilter = document.getElementById('voucherFilter').value;
  const fromDate = document.getElementById('dateFrom').value;
  const toDate = document.getElementById('dateTo').value;

  let rows = JWL_DATA.filter(r => {
    if(supplierFilter && r.supplier !== supplierFilter) return false;
    if(rmtFilter && r.rawMaterialType !== rmtFilter) return false;
    if(voucherFilter && r.voucherType !== voucherFilter) return false;
    if(q && !((r.supplier||'').toLowerCase().includes(q) || (r.itemCode||'').toLowerCase().includes(q) || (r.voucherName||'').toLowerCase().includes(q))) return false;
    const d = r.postingDate;
    if(fromDate && d && d < fromDate) return false;
    if(toDate && d && d > toDate) return false;
    return true;
  });

  if(!supplierFilter){
    LAST_BLOCKS = [];
    LAST_FLAT_ROWS = rows.slice().sort((a,b) => new Date(b.datetime||b.postingDate) - new Date(a.datetime||a.postingDate));
    renderFlatList(LAST_FLAT_ROWS);
    document.getElementById('jwlCount').textContent = LAST_FLAT_ROWS.length + ' entries';
    document.getElementById('jwlSub').textContent = JWL_DATA.length + ' total entries · select a supplier to see its running balance';
    return;
  }

  const groups = {};
  rows.forEach(r => {
    const supplier = r.supplier || '— No Supplier —';
    const key = supplier + '||' + r.rawMaterialType;
    (groups[key] = groups[key] || { supplier, rawMaterialType: r.rawMaterialType, rows: [] }).rows.push(r);
  });

  const blocks = Object.keys(groups).sort((a,b)=>groups[a].supplier.localeCompare(groups[b].supplier) || groups[a].rawMaterialType.localeCompare(groups[b].rawMaterialType)).map(key => {
    const g = groups[key];
    const all = g.rows.slice().sort((a,b) => new Date(a.datetime||a.postingDate) - new Date(b.datetime||b.postingDate));
    let opening = 0;
    const periodRows = [];
    all.forEach(r => {
      const d = r.postingDate;
      if(fromDate && d && d < fromDate){ opening += netEffect(r); return; }
      if(toDate && d && d > toDate) return;
      periodRows.push(r);
    });
    let running = opening;
    const withBalance = periodRows.map(r => { running += netEffect(r); return { ...r, runningBalance: running }; });
    return { supplier: g.supplier, rawMaterialType: g.rawMaterialType, opening, rows: withBalance, closing: running };
  });

  LAST_FLAT_ROWS = [];
  LAST_BLOCKS = blocks;
  renderReport(blocks);

  const totalRows = blocks.reduce((s,b)=>s+b.rows.length,0);
  document.getElementById('jwlCount').textContent = totalRows + ' entries';
  document.getElementById('jwlSub').textContent = JWL_DATA.length + ' total entries · ' + blocks.length + ' supplier/material balance(s) shown';
}

function tagCell(r){
  return r.isCancel ? '<span class="cd-pill amber"><span class="cd-pill-dot"></span>Reversal</span>' : '—';
}

function renderFlatList(rows){
  const wrap = document.getElementById('reportBody');
  if(!rows.length){
    wrap.innerHTML = `<div class="cd-table-wrap"><div class="cd-empty"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="cd-empty-title">No ledger entries match these filters</div></div></div>`;
    return;
  }
  const rowsHtml = rows.map(r => `
    <tr>
      <td>${fmtDate(r.postingDate)}</td>
      <td>${esc(r.supplier)||'—'}</td>
      <td><span class="cd-pill grey"><span class="cd-pill-dot" style="background:${RMT_COLORS[r.rawMaterialType]||'#888'}"></span>${esc(r.rawMaterialType)}</span></td>
      <td>${esc(r.itemCode)||'—'}</td>
      <td>${voucherPill(r.voucherType)}</td>
      <td>${esc(r.voucherName)}</td>
      <td>${tagCell(r)}</td>
      <td class="num cd-dr">${r.qtyDr?fmtQty(r.qtyDr):'—'}</td>
      <td class="num cd-cr">${r.qtyCr?fmtQty(r.qtyCr):'—'}</td>
      <td class="num cd-dr">${r.pureQtyDr?fmtQty(r.pureQtyDr):'—'}</td>
      <td class="num cd-cr">${r.pureQtyCr?fmtQty(r.pureQtyCr):'—'}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <div class="cd-table-wrap">
      <table class="cd-table">
        <thead><tr>
          <th>Date</th><th>Supplier</th><th>Raw Material</th><th>Item</th><th>Voucher Type</th><th>Voucher No.</th><th>Tag</th>
          <th style="text-align:right">Qty Dr</th><th style="text-align:right">Qty Cr</th>
          <th style="text-align:right">Pure Qty Dr</th><th style="text-align:right">Pure Qty Cr</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}

function renderReport(blocks){
  const wrap = document.getElementById('reportBody');
  if(!blocks.length || blocks.every(b=>!b.rows.length)){
    wrap.innerHTML = `<div class="cd-table-wrap"><div class="cd-empty"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="cd-empty-title">No ledger entries match these filters</div></div></div>`;
    return;
  }
  wrap.innerHTML = blocks.filter(b=>b.rows.length).map(b => {
    const color = RMT_COLORS[b.rawMaterialType] || '#888';
    const unit = unitFor(b.rawMaterialType);
    const rowsHtml = b.rows.map(r => `
      <tr>
        <td>${fmtDate(r.postingDate)}</td>
        <td>${esc(r.itemCode)||'—'}</td>
        <td>${voucherPill(r.voucherType)}</td>
        <td>${esc(r.voucherName)}</td>
        <td>${tagCell(r)}</td>
        <td class="num cd-dr">${r.qtyDr?fmtQty(r.qtyDr):'—'}</td>
        <td class="num cd-cr">${r.qtyCr?fmtQty(r.qtyCr):'—'}</td>
        <td class="num cd-dr">${r.pureQtyDr?fmtQty(r.pureQtyDr):'—'}</td>
        <td class="num cd-cr">${r.pureQtyCr?fmtQty(r.pureQtyCr):'—'}</td>
        <td class="num">${fmtQty(r.runningBalance)}</td>
      </tr>`).join('');
    return `
    <div class="cd-table-wrap">
      <div class="cd-group-head">
        <div class="cd-group-title"><span class="cd-group-dot" style="background:${color}"></span>${esc(b.supplier)}<span style="font-weight:400;color:var(--text-muted);margin-left:6px">· ${esc(b.rawMaterialType)}</span></div>
        <div class="cd-group-stat">Opening ${fmtQty(b.opening)} ${unit} · Pending <strong style="color:var(--text-primary)">${fmtQty(b.closing)} ${unit}</strong></div>
      </div>
      <table class="cd-table">
        <thead><tr>
          <th>Date</th><th>Item</th><th>Voucher Type</th><th>Voucher No.</th><th>Tag</th>
          <th style="text-align:right">Qty Dr</th><th style="text-align:right">Qty Cr</th>
          <th style="text-align:right">Pure Qty Dr</th><th style="text-align:right">Pure Qty Cr</th>
          <th style="text-align:right">Balance (${unit})</th>
        </tr></thead>
        <tbody>
          <tr class="opening"><td colspan="9">Opening Balance</td><td class="num">${fmtQty(b.opening)}</td></tr>
          ${rowsHtml}
          <tr class="closing"><td colspan="9">Still Pending With Supplier</td><td class="num">${fmtQty(b.closing)}</td></tr>
        </tbody>
      </table>
    </div>`;
  }).join('');
}

function exportCSV(){
  const lines = [];

  if(LAST_BLOCKS.length){
    const header = ['Supplier','Raw Material Type','Date','Item','Voucher Type','Voucher No','Qty Dr','Qty Cr','Pure Qty Dr','Pure Qty Cr','Balance'];
    lines.push(header.join(','));
    LAST_BLOCKS.forEach(b => {
      if(!b.rows.length) return;
      const supplierCsv = `"${b.supplier.replace(/"/g,'""')}"`;
      lines.push([supplierCsv,b.rawMaterialType,'Opening Balance','','','','','','',b.opening.toFixed(3),b.opening.toFixed(3)].join(','));
      b.rows.forEach(r => {
        lines.push([
          supplierCsv, b.rawMaterialType, r.postingDate, r.itemCode, r.voucherType, r.voucherName,
          r.qtyDr.toFixed(3), r.qtyCr.toFixed(3), r.pureQtyDr.toFixed(3), r.pureQtyCr.toFixed(3),
          r.runningBalance.toFixed(3)
        ].join(','));
      });
      lines.push([supplierCsv,b.rawMaterialType,'Still Pending','','','','','','',b.closing.toFixed(3),b.closing.toFixed(3)].join(','));
    });
  } else if(LAST_FLAT_ROWS.length){
    const header = ['Date','Supplier','Raw Material Type','Item','Voucher Type','Voucher No','Qty Dr','Qty Cr','Pure Qty Dr','Pure Qty Cr'];
    lines.push(header.join(','));
    LAST_FLAT_ROWS.forEach(r => {
      lines.push([
        r.postingDate, `"${(r.supplier||'').replace(/"/g,'""')}"`, r.rawMaterialType, r.itemCode, r.voucherType, r.voucherName,
        r.qtyDr.toFixed(3), r.qtyCr.toFixed(3), r.pureQtyDr.toFixed(3), r.pureQtyCr.toFixed(3),
      ].join(','));
    });
  } else {
    return;
  }

  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `job-work-ledger-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Defaults the date range to the trailing month on first load — toLocaleDateString('en-CA')
// gives a local-timezone YYYY-MM-DD (toISOString() reports UTC, which lands on the wrong day
// for part of every evening in IST).
function setDefaultDateRange(){
  const to = new Date();
  const from = new Date();
  from.setMonth(from.getMonth() - 1);
  document.getElementById('dateFrom').value = from.toLocaleDateString('en-CA');
  document.getElementById('dateTo').value = to.toLocaleDateString('en-CA');
}
setDefaultDateRange();
load();
